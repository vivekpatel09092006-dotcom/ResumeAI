{% extends "base.html" %}{% block content %}<section class="auth"><div class="auth-card"><span class="eyebrow">RESUMEAI ACCOUNT</span><h1>{{"Create account" if mode=="register" else "Welcome back"}}</h1><form method="post">{% if mode=="register" %}<label>Name<input name="name" required></label>{% endif %}<label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button class="btn primary">{{"Create Account" if mode=="register" else "Login"}}</button></form><p>{% if mode=="register" %}Already have an account? <a href="{{url_for('login')}}">Login</a>{% else %}New user? <a href="{{url_for('register')}}">Create account</a>{% endif %}</p></div></section>{% endblock %}
