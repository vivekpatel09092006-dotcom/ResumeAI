{% extends "base.html" %}{% block content %}<section class="page-head"><span class="eyebrow">APPLICATION TRACKER</span><h1>Applications</h1></section><section class="card"><form class="inline-form" method="post"><input name="job_title" placeholder="Role" required><input name="company" placeholder="Company" required><select name="status"><option>Applied</option><option>Interview</option><option>Selected</option><option>Rejected</option></select><input name="notes" placeholder="Notes"><button class="btn primary">Add</button></form></section><section class="card">{% for a in rows %}<div class="list-row"><div><b>{{a["job_title"]}} — {{a["company"]}}</b><small>{{a["notes"]}} • {{a["created_at"]}}</small></div><div><span class="pill">{{a["status"]}}</span><form method="post" action="{{url_for('application_delete',aid=a['id'])}}"><button class="btn danger small">{{tr.delete}}</button></form></div></div>{% else %}<p>No applications tracked.</p>{% endfor %}</section>{% endblock %}
