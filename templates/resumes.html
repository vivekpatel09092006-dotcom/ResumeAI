{% extends "base.html" %}{% block content %}<section class="page-head"><span class="eyebrow">FILE MANAGER</span><h1>My Resumes</h1><p>Delete uploaded files whenever you want.</p></section><section class="card">{% for r in rows %}<div class="list-row"><div><b>📄 {{r["resume_name"]}}</b><small>{{r["created_at"]}}</small></div><form method="post" action="{{url_for('resume_delete',rid=r['id'])}}" onsubmit="return confirm('Delete this uploaded resume and its analysis records?')"><button class="btn danger">{{tr.delete}}</button></form></div>{% else %}<p>No uploaded resumes.</p>{% endfor %}</section>{% endblock %}
